name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            prototype/tlstun/go.mod
      - name: Unit and race tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Legacy prototype tests
        run: go test ./prototype/tlstun
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/tlsnet-linux-amd64 ./cmd/tlsnet
      - name: Build Linux ARM64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/tlsnet-linux-arm64 ./cmd/tlsnet
      - name: Prepare embedded Wintun
        shell: pwsh
        run: ./scripts/get-wintun.ps1 -Destination internal/windowsapp/assets
      - name: Build Windows AMD64
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/tlsnet-windows-amd64.exe ./cmd/tlsnet
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui" -o /tmp/TlsNet.exe ./cmd/tlsnet-windows
      - uses: actions/upload-artifact@v4
        with:
          name: tlsnet-windows-native
          path: /tmp/TlsNet.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build gomobile AAR and debug APK
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tlsnet-android-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
