name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: prototype/tlstun/go.mod
      - name: Test prototype
        run: go test ./prototype/tlstun
      - name: Build Linux prototype
        run: go build -o /tmp/tlstun-prototype ./prototype/tlstun
