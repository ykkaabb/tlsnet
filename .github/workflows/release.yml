name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build packages
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'linux'
          foreach ($architecture in @('amd64', 'arm64')) {
            $package = "dist/linux-$architecture"
            New-Item -ItemType Directory -Force "$package/scripts", "$package/configs", "$package/packaging/linux" | Out-Null
            $env:GOARCH = $architecture
            go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$package/tlsnet" ./cmd/tlsnet
            Copy-Item README.md -Destination $package
            Copy-Item configs/*.toml -Destination "$package/configs"
            Copy-Item scripts/setup-linux.sh, scripts/install-linux.sh, scripts/uninstall-linux.sh -Destination "$package/scripts"
            Copy-Item packaging/linux/tlsnet.service -Destination "$package/packaging/linux"
            chmod +x "$package/tlsnet" "$package/scripts/setup-linux.sh" "$package/scripts/install-linux.sh" "$package/scripts/uninstall-linux.sh"
            # Archive named entries instead of `.` so extraction never attempts
            # to chmod or retimestamp the caller's destination directory (for
            # example the sticky, root-owned /tmp directory).
            tar -C $package -czf "dist/tlsnet-$version-linux-$architecture.tar.gz" README.md configs packaging scripts tlsnet
          }
          New-Item -ItemType Directory -Force dist/windows-amd64 | Out-Null
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          ./scripts/get-wintun.ps1 -Destination internal/windowsapp/assets
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" -o dist/windows-amd64/TlsNet.exe ./cmd/tlsnet-windows
          Copy-Item README.md -Destination dist/windows-amd64
          Copy-Item internal/windowsapp/assets/WINTUN-LICENSE.txt -Destination dist/windows-amd64
          Copy-Item dist/windows-amd64/TlsNet.exe -Destination "dist/tlsnet-$version-windows-amd64.exe"
          Compress-Archive -Path dist/windows-amd64/* -DestinationPath "dist/tlsnet-$version-windows-amd64.zip"
      - name: Build Android APK
        env:
          TLSNET_KEYSTORE_BASE64: ${{ secrets.TLSNET_KEYSTORE_BASE64 }}
          TLSNET_SIGNING_STORE_FILE: ${{ runner.temp }}/tlsnet-release.jks
          TLSNET_SIGNING_STORE_PASSWORD: ${{ secrets.TLSNET_SIGNING_STORE_PASSWORD }}
          TLSNET_SIGNING_KEY_ALIAS: ${{ secrets.TLSNET_SIGNING_KEY_ALIAS }}
          TLSNET_SIGNING_KEY_PASSWORD: ${{ secrets.TLSNET_SIGNING_KEY_PASSWORD }}
        run: |
          printf '%s' "$TLSNET_KEYSTORE_BASE64" | base64 --decode > "$TLSNET_SIGNING_STORE_FILE"
          ./scripts/build-android.sh --release
      - name: Collect Android APK
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          Copy-Item clients/android/app/build/outputs/apk/release/app-release.apk "dist/tlsnet-$version-android.apk"
      - name: Generate checksums and bootstrap
        run: |
          cp scripts/bootstrap-linux.sh dist/tlsnet-bootstrap.sh
          chmod +x dist/tlsnet-bootstrap.sh
          cd dist
          sha256sum *.tar.gz *.zip *.exe *.apk tlsnet-bootstrap.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tlsnet-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.apk
            dist/SHA256SUMS
            dist/tlsnet-bootstrap.sh
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.exe dist/*.apk dist/SHA256SUMS dist/tlsnet-bootstrap.sh --generate-notes
